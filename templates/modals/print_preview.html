<!-- MODAL: DOCUMENT PREVIEW (flow: Preview -> Download -> Print) -->
<div id="modal-print-preview" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3><i class="fa-solid fa-eye"></i> Document Preview</h3>
      <button type="button" onclick="closePrintPreviewModal()" class="modal-close-btn" aria-label="Close preview">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Sticky action bar: download is deliberately the second action after preview -->
      <div class="preview-doc-bar">
        <span class="preview-doc-name" id="preview-doc-title">Document</span>
        <div class="preview-doc-actions">
          <button type="button" onclick="downloadCurrentPreviewDocument()" class="btn btn-secondary">
            <i class="fa-solid fa-download"></i> Download
          </button>
          <button type="button" onclick="printReceipt()" class="btn btn-primary">
            <i class="fa-solid fa-print"></i> Print / PDF
          </button>
        </div>
      </div>
      <div class="preview-doc-surface">
        <div id="printable-receipt"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" onclick="closePrintPreviewModal()" class="btn btn-secondary">Close</button>
    </div>
  </div>
</div>
