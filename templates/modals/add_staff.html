<!-- MODAL: ADD STAFF -->
<div id="modal-add-staff" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-staff-title">Add Staff Member</h3>
      <button onclick="closeAddStaffModal()" class="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="staff-id-hidden" value="">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="staff-name-input" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" id="staff-username-input" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="staff-password-input" class="form-control" placeholder="Leave blank to keep unchanged on edit">
      </div>
      <div class="form-group">
        <label class="form-label">Role *</label>
        <select id="staff-role-select" class="form-control">
          <option value="Admin">Admin</option>
          <option value="Manager">Manager</option>
          <option value="Cashier">Cashier</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddStaffModal()" class="btn btn-secondary">Cancel</button>
      <button onclick="submitSaveStaff()" class="btn btn-primary">Save Staff</button>
    </div>
  </div>
</div>
