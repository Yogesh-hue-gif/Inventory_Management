<!-- MODAL: ADD CUSTOMER -->
<div id="modal-add-customer" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-customer-title">Add Customer</h3>
      <button onclick="closeAddCustomerModal()" class="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="customer-id-hidden" value="">
      <div class="form-group">
        <label class="form-label">Customer Name *</label>
        <input type="text" id="cust-name-input" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" id="cust-phone-input" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" id="cust-address-input" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="cust-type-select" class="form-control">
          <option value="Retail">Retail</option>
          <option value="Wholesale">Wholesale</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddCustomerModal()" class="btn btn-secondary">Cancel</button>
      <button onclick="submitSaveCustomer()" class="btn btn-primary">Save Customer</button>
    </div>
  </div>
</div>
