<!-- MODAL: ADD / EDIT PRODUCT -->
<div id="modal-add-product" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modal-product-title"><i class="fa-solid fa-box"></i> Add New Product</h3>
      <button onclick="closeAddProductModal()" class="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="product-id-hidden" value="">
      <div class="form-group">
        <label class="form-label">Product Name *</label>
        <input type="text" id="product-name-input" class="form-control" placeholder="e.g. UPVC Pipe 1 inch" required>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label class="form-label" style="margin-bottom: 0;">Category *</label>
          <button type="button" onclick="openAddCategoryModal()" style="font-size: 11px; color: var(--accent-blue); background: none; border: none; cursor: pointer; text-decoration: underline; font-weight: 600;">+ Add Category</button>
        </div>
        <select id="product-category-select" class="form-control" required style="width: 100%;">
          <option value="">Select category</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <textarea id="product-desc-input" class="form-control" rows="3" placeholder="Optional product details..."></textarea>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="product-active-chk" checked style="accent-color: #2563eb;">
        <label for="product-active-chk" style="font-size: 13px; color: #374151;">Product is active</label>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddProductModal()" class="btn btn-secondary">Cancel</button>
      <button onclick="submitSaveProduct()" id="btn-save-product" class="btn btn-primary">Save Product</button>
    </div>
  </div>
</div>
