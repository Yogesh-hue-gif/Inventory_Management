<!-- VIEW 4: POS / SELL PRODUCT (Matching project_IVM.pdf Page 10 & 11) -->
<section id="view-pos" class="page-view">
  <!-- Load Quotation Header Bar -->
  <div class="card-box" style="margin-bottom: 16px; padding: 12px 16px;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <div style="position: relative; flex: 1;">
        <i class="fa-solid fa-file-invoice" style="position: absolute; left: 10px; top: 10px; color: #9ca3af; font-size: 13px;"></i>
        <input type="text" id="pos-quotation-input" class="form-control" style="padding-left: 32px;" placeholder="Quotation number...">
      </div>
      <button onclick="loadQuotationIntoPOS()" class="btn btn-primary" style="padding: 8px 18px;">
        Load
      </button>
    </div>
    <div id="pos-loaded-quo-banner" style="display: none; margin-top: 10px; background: #d1fae5; border: 1px solid #6ee7b7; color: #047857; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; justify-content: space-between; align-items: center;">
      <span id="pos-loaded-quo-text">✓ QUO-2026-041022804 — Walk-In Customer</span>
      <button onclick="clearLoadedQuotationInPOS()" style="background: transparent; border: none; color: #047857; cursor: pointer; font-size: 14px;">✕</button>
    </div>
  </div>

  <div class="pos-layout">
    <!-- Left Main Product & Cart Panel -->
    <div>
      <div class="card-box" style="margin-bottom: 16px; padding: 12px 16px;">
        <div style="position: relative;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 10px; color: #9ca3af; font-size: 13px;"></i>
          <select id="pos-product-search-select" onchange="addProductToPOSCart()" class="form-control" style="padding-left: 32px;">
            <option value="">Search & add product...</option>
          </select>
        </div>
      </div>

      <div class="table-container" style="min-height: 420px; background: #ffffff;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;"><i class="fa-solid fa-square-check"></i></th>
              <th>PRODUCT</th>
              <th>UNIT PRICE</th>
              <th>QTY</th>
              <th>SUBTOTAL</th>
              <th style="width: 40px;"></th>
            </tr>
          </thead>
          <tbody id="pos-cart-items-body"></tbody>
        </table>
        <div id="pos-empty-cart-msg" style="padding: 60px 20px; text-align: center; color: #9ca3af;">
          <i class="fa-solid fa-basket-shopping" style="font-size: 42px; color: #cbd5e1; margin-bottom: 10px;"></i>
          <div style="font-weight: 600; color: #64748b;">Cart is empty</div>
          <div style="font-size: 12px; margin-top: 4px;">Search a product above or load a quotation</div>
        </div>
      </div>

      <div style="margin-top: 12px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; background: #ffffff; padding: 12px 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
        <span style="font-size: 13px; font-weight: 700; color: #6b7280; text-transform: uppercase;">GRAND TOTAL</span>
        <span id="pos-grand-total-label" style="font-size: 18px; font-weight: 700; color: #111827;">Rs. 0</span>
      </div>
    </div>

    <!-- Right Dark Checkout Panel (#111827) -->
    <div class="dark-checkout-panel">
      <div>
        <div style="font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase;">
          <i class="fa-solid fa-user"></i> CUSTOMER
        </div>
        <div class="customer-type-toggle">
          <button type="button" id="pos-type-walkin" onclick="setPOSCustomerType('walkin')" class="btn-toggle active">Walk-In</button>
          <button type="button" id="pos-type-regular" onclick="setPOSCustomerType('regular')" class="btn-toggle">Regular</button>
        </div>
        <input type="hidden" id="pos-quotation-ref-input" value="">
        <div class="form-group">
          <label class="form-label" style="color:#9ca3af;"><i class="fa-solid fa-user"></i> Customer name</label>
          <input type="text" id="pos-customer-input" class="form-control" style="background:#1f2937; border-color:#374151; color:#fff;" value="Walk-in Customer" placeholder="Walk-in Customer">
        </div>
        <button type="button" style="width: 100%; padding: 7px; background: #1f2937; border: 1px dashed #374151; color: #9ca3af; border-radius: 6px; font-size: 11px; margin-bottom: 16px; cursor: pointer;">
          <i class="fa-solid fa-user-secret"></i> Anonymous walk-in customer
        </button>

        <div style="font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase;">
          <i class="fa-solid fa-receipt"></i> ORDER SUMMARY
        </div>
        <div style="font-size: 13px; line-height: 1.8; margin-bottom: 12px; border-bottom: 1px solid #1f2937; padding-bottom: 10px;">
          <div style="display: flex; justify-content: space-between;">
            <span style="color: #9ca3af;">Items</span>
            <strong id="pos-summary-items-cnt">0</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: #9ca3af;">Subtotal</span>
            <strong id="pos-summary-subtotal">Rs 0</strong>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" style="color: #9ca3af;"><i class="fa-solid fa-heart"></i> OVERALL DISCOUNT</label>
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <input type="number" id="pos-discount-input" onkeyup="renderPOSCart()" class="form-control" value="0" style="background: #1f2937; border-color: #374151; color: #fff; width: 80px;">
            <span style="color: #38bdf8; font-weight: 700;">%</span>
          </div>
          <div style="display: flex; gap: 4px; margin-bottom: 12px;">
            <button type="button" onclick="setPOSDiscountPreset(0)" class="preset-btn active">0%</button>
            <button type="button" onclick="setPOSDiscountPreset(25)" class="preset-btn">25%</button>
            <button type="button" onclick="setPOSDiscountPreset(50)" class="preset-btn">50%</button>
            <button type="button" onclick="setPOSDiscountPreset(75)" class="preset-btn">75%</button>
            <button type="button" onclick="setPOSDiscountPreset(100)" class="preset-btn">100%</button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-top: 8px; border-top: 1px solid #1f2937;">
          <span>Net Total</span>
          <span id="pos-summary-net-total" style="color: #ffffff;">Rs 0</span>
        </div>

        <div style="font-size: 11px; font-weight: 700; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase;">
          <i class="fa-solid fa-wallet"></i> PAYMENT
        </div>
        <div class="form-group">
          <label class="form-label" style="color: #9ca3af;">Cash Received</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 10px; top: 8px; color: #9ca3af; font-weight: 600; font-size: 12px;">Rs</span>
            <input type="number" id="pos-cash-input" onkeyup="renderPOSCart()" class="form-control" value="0" style="padding-left: 32px; background: #1f2937; border-color: #374151; color: #fff;">
          </div>
          <button type="button" onclick="setPOSExactAmount()" class="preset-btn" style="margin-top: 6px; width: 100%; border-style: dashed; color: #38bdf8;">
            ✓ Exact amount!
          </button>
        </div>
        <div id="pos-success-alert-banner" style="display:none; align-items:center; gap:8px; margin-top:12px; padding:9px 10px; border-radius:6px; background:#d1fae5; border:1px solid #6ee7b7; color:#047857; font-size:11px; font-weight:600;">
          <i class="fa-solid fa-circle-check"></i><span id="pos-success-alert-text"></span>
        </div>
        <div id="pos-last-bill-ref" style="display:none; margin-top:8px; color:#9ca3af; font-size:11px; text-align:center;"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
        <button type="button" onclick="downloadPOSBill()" class="btn" style="background:#1f2937; border: 1px solid #374151; color: #ffffff; width: 100%; justify-content: center;">
          <i class="fa-solid fa-download"></i> Download Bill
        </button>
        <button type="button" onclick="printPOSBill()" class="btn" style="background: #1f2937; border: 1px solid #374151; color: #ffffff; width: 100%; justify-content: center;">
          <i class="fa-solid fa-print"></i> Print Bill
        </button>
        <button type="button" onclick="submitCreatePOSBill()" class="btn btn-success" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
          ✓ Create Bill
        </button>
      </div>
    </div>
  </div>
</section>
