<!-- VIEW 3: BATCHES (Matching project_IVM.pdf Page 5 & 6) -->
<section id="view-batches" class="page-view">
  <div class="page-header" style="margin-bottom: 16px;">
    <div>
      <h2 style="font-size: 20px; font-weight: 700;">Purchase Batches</h2>
      <p style="color: #6b7280; font-size: 13px;">Manage all supplier purchase batches</p>
    </div>
    <div class="page-header-actions">
      <button onclick="loadBatches()" class="btn btn-secondary">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
      <button onclick="openNewBatchModal()" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> New Batch
      </button>
    </div>
  </div>


  <div class="card-box" style="margin-bottom: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
    <div style="position: relative; width: 400px;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 10px; color: #9ca3af; font-size: 13px;"></i>
      <input type="text" onkeyup="filterBatchesSearch(this.value)" class="form-control" style="padding-left: 32px;" placeholder="Search by batch name or supplier...">
    </div>
    <div style="font-size: 12px; color: #6b7280; font-weight: 600;" id="batches-count-label">14 batches</div>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>BATCH NAME</th>
          <th>SUPPLIER</th>
          <th>TOTAL PRICE</th>
          <th>PAID</th>
          <th>REMAINING</th>
          <th>STATUS</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="batches-table-body"></tbody>
    </table>
  </div>
</section>
