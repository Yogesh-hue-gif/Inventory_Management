<!-- VIEW 10: QUOTATIONS (Matching project_IVM.pdf Page 7, 8, 9) -->
<section id="view-quotations" class="page-view">
  <div class="page-header" style="margin-bottom: 16px;">
    <div>
      <h2 style="font-size: 20px; font-weight: 700;">Quotations</h2>
      <p style="color: #6b7280; font-size: 13px;">Create & manage customer price quotations</p>
    </div>
    <button onclick="openNewQuotationModal()" class="btn btn-primary">
      <i class="fa-solid fa-plus"></i> New Quotation
    </button>
  </div>

  <div class="card-box" style="margin-bottom: 16px; padding: 12px 16px; display: flex; gap: 10px;">
    <div style="position: relative; flex: 1;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 10px; color: #9ca3af; font-size: 13px;"></i>
      <input type="text" id="quo-search-input" class="form-control" style="padding-left: 32px;" placeholder="Search by quotation number (e.g. QT-001)...">
    </div>
    <button onclick="searchQuotations()" class="btn btn-primary">
      <i class="fa-solid fa-magnifying-glass"></i> Search
    </button>
  </div>

  <div style="display: grid; grid-template-columns: 360px 1fr; gap: 16px;">
    <div>
      <div style="font-size: 11px; font-weight: 700; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em;">
        ALL QUOTATIONS <span id="quo-all-cnt" style="color: #2563eb;">23</span>
      </div>
      <div id="quotations-list" style="height: 520px; overflow-y: auto; padding-right: 4px;"></div>
    </div>
    <div class="card-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 400px; color: #9ca3af;" id="quo-detail-preview">
      <i class="fa-solid fa-file-invoice" style="font-size: 48px; color: #cbd5e1; margin-bottom: 12px;"></i>
      <h3 style="font-size: 16px; color: #475569;">Select a quotation to view details</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Click any item from the list on the left</p>
    </div>
  </div>
</section>
