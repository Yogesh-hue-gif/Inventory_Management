services:
  - type: web
    name: edgen-shop-pos
    runtime: python
    plan: free
    region: singapore
    # NOTE: do not add a `pythonVersion` key here - Render's Blueprint schema
    # does not accept it at service level and the blueprint fails to validate.
    # The Python version is pinned via the PYTHON_VERSION env var below and
    # the .python-version file in the repo root.
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: >
      gunicorn edgen_shop.wsgi:application --chdir . --workers 2 --threads 4
      --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_MYSQL
        value: "false"
      # Render injects DATABASE_URL automatically once the Postgres DB is attached.

databases:
  - name: edgen-shop-db
    databaseName: edgen_shop
    user: edgen_shop
    plan: free
